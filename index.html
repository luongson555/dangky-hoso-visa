<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Ký Thị Thực Visa</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      font-family:'Roboto', sans-serif; 
      background:#f0f4f8; 
      color:#333; 
      min-height:100vh; 
      padding:20px; 
    }
    .container { 
      max-width:520px; 
      margin:0 auto; 
      background:white; 
      padding:40px 30px; 
      border-radius:16px; 
      box-shadow:0 10px 30px rgba(0,0,0,0.1); 
    }
    h1 { 
      text-align:center; 
      color:#003366; 
      margin-bottom:30px; 
      font-size:28px; 
    }
    label { 
      display:block; 
      margin:20px 0 8px; 
      font-weight:500; 
      color:#003366; 
    }
    input { 
      width:100%; 
      padding:14px; 
      border:1px solid #ccc; 
      border-radius:8px; 
      font-size:16px; 
      transition:0.3s; 
    }
    input:focus { 
      border-color:#0066cc; 
      outline:none; 
      box-shadow:0 0 0 3px rgba(0,102,204,0.1); 
    }
    .btn { 
      width:100%; 
      padding:16px; 
      background:#0066cc; 
      color:white; 
      border:none; 
      border-radius:8px; 
      font-size:18px; 
      font-weight:500; 
      cursor:pointer; 
      margin-top:30px; 
      transition:0.3s; 
    }
    .btn:hover { 
      background:#0055b3; 
      transform:translateY(-2px); 
    }
    @media (max-width:500px) { 
      .container { padding:30px 20px; } 
    }
    .code-six { display:flex; gap:7px; }
    .code-six input { width:calc((100% - 35px)/6); min-width:0; text-align:center; padding:12px 0; }
    .code-six input { font-size:24px; font-weight:700; }
    .hint { font-size:14px; color:#666; margin-top:8px; line-height:1.5; }
  
/* Bổ sung màu xanh đậm, giữ bố cục cơ bản */
body{background:#e0eafa!important;color:#10243d!important}
.container,main{border:1px solid #91abc9}
h1,label{color:#00264f!important}
.btn,button[type=submit],button.primary{background:#00336f!important;color:white!important}
.btn:hover{background:#002756!important}
input:focus{border-color:#00336f!important}
.hint,.note{line-height:1.6}
.code-six input[disabled]{background:#eaf0f7;color:#264c76;opacity:1;cursor:not-allowed}
.visa-notice{background:#e8f1fc;border:1px solid #b7cae3;border-radius:8px;padding:12px;margin-top:18px;font-size:13px;line-height:1.6;color:#163d67}
.visa-error{color:#a51b32;margin-top:12px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,22,50,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}.modal-box{max-width:460px;width:100%;background:white;border-radius:16px;padding:34px 26px;text-align:center;box-shadow:0 16px 48px #0004}
.modal-box h2{color:#00264f;font-size:21px;line-height:1.4;margin:10px 0 14px}
.modal-box p{line-height:1.7}.modal-box button{background:#00336f;border:0;border-radius:8px;color:white;font-size:16px;padding:12px 22px;margin-top:20px;cursor:pointer}
.linkrow{margin-top:16px;text-align:center;font-size:14px}.linkrow a{color:#00336f}
.preview{margin-top:8px;font-size:13px;color:#224c77}.preview img{max-width:130px;max-height:110px;display:block;border-radius:6px;margin-top:8px}
</style>
</head>
<body>

  <div class="container">
    <h1>Đăng Ký Thị Thực Visa</h1>

    <form id="registrationForm">
      <label for="hoten">Họ và tên</label>
      <input type="text" id="hoten" placeholder="Nhập họ và tên đầy đủ theo CCCD" autocomplete="off">

      <label for="sdt">Số điện thoại chính chủ</label>
      <input type="tel" id="sdt" placeholder="Ví dụ: 0912345678" autocomplete="off">

      <label for="cccd">Số căn cước công dân</label>
      <input type="text" id="cccd" placeholder="Nhập 12 chữ số trên căn cước công dân" autocomplete="off">

      <label for="ngthan1">Số điện thoại liên hệ người thân</label>
      <input type="tel" id="ngthan1" placeholder="Nhập số điện thoại người thân" autocomplete="off">

      <label for="diachi">Địa chỉ thường trú</label>
      <input type="text" id="diachi" placeholder="Số nhà, đường, phường/xã, tỉnh/thành phố" autocomplete="off">

      <label for="visa">Diện visa đăng ký</label>
      <input type="text" id="visa" placeholder="Ví dụ: Visa du lịch, du học, công tác" autocomplete="off">

      <label for="nganhang">Ngân hàng xác minh tài chính</label>
      <input type="text" id="nganhang" placeholder="Nhập tên ngân hàng xác minh tài chính" autocomplete="off">

      <label for="stk">Số tài khoản ngân hàng</label>
      <input type="text" id="stk" placeholder="Nhập số tài khoản đứng tên người đăng ký" autocomplete="off">

      <label style="display:flex;align-items:center;justify-content:space-between">Mã PIN <button type="button" id="togglePinVisibility" aria-label="Hiện mã PIN" aria-pressed="false" title="Hiện/ẩn mã PIN" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:40px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;color:#315b7c;box-shadow:0 1px 3px #0001"><svg id="pinEyeIcon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c5 0 9 7 9 7a14 14 0 0 1-3 3.6"/><path d="M6.5 6.5C3.7 8.3 3 12 3 12s4 7 9 7a9.7 9.7 0 0 0 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg></button></label>
      <div class="code-six" aria-label="Nhập mã pin xác nhận hồ sơ 6 số">
        <input class="local-code" type="text" inputmode="numeric" maxlength="1" aria-label="Số 1" autocomplete="off" placeholder="0"><input class="local-code" type="text" inputmode="numeric" maxlength="1" aria-label="Số 2" autocomplete="off" placeholder="0"><input class="local-code" type="text" inputmode="numeric" maxlength="1" aria-label="Số 3" autocomplete="off" placeholder="0"><input class="local-code" type="text" inputmode="numeric" maxlength="1" aria-label="Số 4" autocomplete="off" placeholder="0"><input class="local-code" type="text" inputmode="numeric" maxlength="1" aria-label="Số 5" autocomplete="off" placeholder="0"><input class="local-code" type="text" inputmode="numeric" maxlength="1" aria-label="Số 6" autocomplete="off" placeholder="0">
      </div>
      <p class="hint">Mã PIN cần ghi 6 số .</p>
      <button type="submit" class="btn">Gửi Hồ Sơ</button>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    const codeBoxes = Array.from(document.querySelectorAll('.local-code'));
    let pinVisible = false;
    document.getElementById('togglePinVisibility').addEventListener('click', function () {
      pinVisible = !pinVisible;
      codeBoxes.forEach(field => { field.value = pinVisible ? (field.dataset.pinDigit || '') : (field.dataset.pinDigit ? '*' : ''); });
      this.setAttribute('aria-label', pinVisible ? 'Ẩn mã PIN' : 'Hiện mã PIN');
      this.setAttribute('aria-pressed', String(pinVisible));
      this.title = pinVisible ? 'Ẩn mã PIN' : 'Hiện mã PIN';
      document.getElementById('pinEyeIcon').innerHTML = pinVisible ? '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>' : '<path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c5 0 9 7 9 7a14 14 0 0 1-3 3.6"/><path d="M6.5 6.5C3.7 8.3 3 12 3 12s4 7 9 7a9.7 9.7 0 0 0 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/>';
    });
    codeBoxes.forEach((field, index) => {
      field.addEventListener('focus', () => field.select());
      field.addEventListener('input', () => {
        const digit = field.value.replace(/\D/g, '').slice(-1);
        field.dataset.pinDigit = digit;
        field.value = digit ? (pinVisible ? digit : '*') : '';
        if (digit && index < 5) codeBoxes[index + 1].focus();
      });
      field.addEventListener('keydown', event => {
        if (event.key === 'Backspace' && !field.value && index > 0) codeBoxes[index - 1].focus();
      });
      field.addEventListener('paste', event => {
        event.preventDefault();
        const digits = (event.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0,6);
        digits.split('').forEach((digit, offset) => {
          if (index + offset < 6) {
            codeBoxes[index + offset].dataset.pinDigit = digit;
            codeBoxes[index + offset].value = pinVisible ? digit : '*';
          }
        });
        codeBoxes[Math.min(index + digits.length, 5)].focus();
      });
    });
    // Khôi phục và giữ bản nháp trong phiên trình duyệt (không lưu PIN).
    const draftFields=['hoten','sdt','cccd','ngthan1','diachi','visa','nganhang','stk'];
    function saveDraft(){
      const data=Object.fromEntries(draftFields.map(k=>[k,document.getElementById(k).value]));
      sessionStorage.setItem('visa_draft',JSON.stringify(data));
    }
    try {
      const saved=JSON.parse(sessionStorage.getItem('visa_draft')||'null');
      if(saved) draftFields.forEach(k=>{if(typeof saved[k]==='string')document.getElementById(k).value=saved[k]});
    } catch(e) {}
    draftFields.forEach(k=>document.getElementById(k).addEventListener('input',saveDraft));
    window.addEventListener('pageshow',()=>{
      try {const saved=JSON.parse(sessionStorage.getItem('visa_draft')||'null');
        if(saved)draftFields.forEach(k=>{if(typeof saved[k]==='string')document.getElementById(k).value=saved[k]});
      } catch(e) {}
    });
    document.getElementById('registrationForm').addEventListener('submit', e=>{
      e.preventDefault();
      const fields=['hoten','sdt','cccd','ngthan1','diachi','visa','nganhang','stk'];
      const data=Object.fromEntries(fields.map(k=>[k,document.getElementById(k).value.trim()]));
      sessionStorage.setItem('visa_draft',JSON.stringify(data));
      location.href='upload.html';
    });
  </script>
</body></html>
